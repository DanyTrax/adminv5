<!DOCTYPE html>
<html>
<head>
    <title>Test Búsqueda de Solicitudes</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h2>🧪 Test de Búsqueda de Solicitudes</h2>
    
    <div>
        <label>Buscar solicitudes:</label>
        <input type="text" id="numeroSolicitudBuscar" placeholder="Escribe 'SOL' o 'SOL000005'">
        <button onclick="probarBusqueda()">Probar Búsqueda</button>
    </div>
    
    <div id="resultados" style="margin-top: 20px; border: 1px solid #ccc; padding: 10px; min-height: 100px;">
        <p>Los resultados aparecerán aquí...</p>
    </div>

    <script>
        function probarBusqueda() {
            var termino = $("#numeroSolicitudBuscar").val();
            console.log("🔍 Buscando con término:", termino);
            
            $("#resultados").html('<p>Buscando...</p>');
            
            $.ajax({
                url: "ajax/productos-despacho.ajax.php",
                method: "POST",
                data: {
                    buscarSolicitudes: true,
                    termino: termino
                },
                dataType: "json",
                success: function(respuesta) {
                    console.log("✅ Respuesta recibida:", respuesta);
                    
                    if(respuesta.success && respuesta.solicitudes && respuesta.solicitudes.length > 0) {
                        var html = "<h3>Solicitudes encontradas:</h3><ul>";
                        respuesta.solicitudes.forEach(function(solicitud) {
                            html += "<li>" + solicitud.numero_solicitud + " - " + solicitud.nombre_usuario_solicitante + " (" + solicitud.estado + ")</li>";
                        });
                        html += "</ul>";
                        $("#resultados").html(html);
                    } else {
                        $("#resultados").html("<p>❌ No se encontraron solicitudes</p>");
                    }
                },
                error: function(xhr, status, error) {
                    console.error("❌ Error AJAX:", error);
                    console.error("Status:", status);
                    console.error("Response:", xhr.responseText);
                    $("#resultados").html("<p>❌ Error: " + error + "</p><pre>" + xhr.responseText + "</pre>");
                }
            });
        }
        
        // Auto-búsqueda cuando se escribe
        $("#numeroSolicitudBuscar").on("keyup", function() {
            var termino = $(this).val();
            if(termino.length >= 3) {
                probarBusqueda();
            }
        });
    </script>
</body>
</html>
